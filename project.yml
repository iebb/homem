name: Homem
options:
  bundleIdPrefix: ad.neko
  deploymentTarget:
    iOS: '17.0'
    visionOS: '26.0'
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    # Keep older Xcode Cloud SDKs buildable; Duo APIs are present in 27.1.
    'SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphone*27.1*]': '$(inherited) HOMEM_DUO_SDK'
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    MARKETING_VERSION: '1.2'
    CURRENT_PROJECT_VERSION: '120'
    DEVELOPMENT_TEAM: 7P8CLHDH5G
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  HighlightSwift:
    url: https://github.com/appstefan/HighlightSwift.git
    exactVersion: 1.1.0
  L10n-swift:
    url: https://github.com/Decybel07/L10n-swift.git
    exactVersion: 5.10.3
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.20.0
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 153.0.0
  LiveKitWebRTC:
    url: https://github.com/livekit/webrtc-xcframework.git
    exactVersion: 150.7871.02
targets:
  HomemMac:
    type: application
    platform: macOS
    deploymentTarget: '14.0'
    sources:
      - path: HomemMac
      - path: Homem/Core
        group: Homem
      - path: Homem/Resources/Localizable.xcstrings
        group: Homem/Resources
      - path: Homem/Resources/memoh-openapi.json
        group: Homem/Resources
      - path: UITestSupport/App/OfficialLoginFixture.swift
    settings:
      base:
        PRODUCT_NAME: Homem
        PRODUCT_MODULE_NAME: Homem
        PRODUCT_BUNDLE_IDENTIFIER: ad.neko.homem
        INFOPLIST_FILE: HomemMac/Info.plist
        CODE_SIGN_ENTITLEMENTS: Homem/Homem-Mac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: HighlightSwift
      - package: L10n-swift
      - package: SwiftTerm
      - package: LiveKitWebRTC
  HomemMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HomemMacTests
      - path: HomemTests/RFBClientTests.swift
      - path: HomemTests/ChatQueueTests.swift
      - path: HomemTests/ChatHistoryTests.swift
      - path: HomemTests/ModelCatalogTests.swift
      - path: HomemTests/OfficialLoginTests.swift
      - path: HomemTests/SpatialWorkspaceTests.swift
      - path: HomemTests/CodeFormattingTests.swift
      - path: HomemTests/KeychainTests.swift
    dependencies:
      - target: HomemMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Homem.app/Contents/MacOS/Homem"
  Homem:
    type: application
    platform: iOS
    sources:
      - path: Homem
        excludes: [Info-Vision.plist]
      - path: UITestSupport/App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ad.neko.homem
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_FILE: Homem/Info.plist
        CODE_SIGN_ENTITLEMENTS: Homem/Homem.entitlements
        'CODE_SIGN_ENTITLEMENTS[sdk=macosx*]': Homem/Homem-Mac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: HomemShare
        embed: true
      - package: HighlightSwift
      - package: L10n-swift
      - package: SwiftTerm
      - package: WebRTC
  HomemVision:
    type: application
    platform: visionOS
    sources:
      - path: Homem
        excludes: [Info.plist]
      - path: UITestSupport/App
    settings:
      base:
        PRODUCT_NAME: Homem
        PRODUCT_MODULE_NAME: Homem
        PRODUCT_BUNDLE_IDENTIFIER: ad.neko.homem
        INFOPLIST_FILE: Homem/Info-Vision.plist
        CODE_SIGN_ENTITLEMENTS: Homem/Homem.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconVision
    dependencies:
      - package: HighlightSwift
      - package: L10n-swift
      - package: SwiftTerm
      - package: LiveKitWebRTC
  HomemVisionTests:
    type: bundle.unit-test
    platform: visionOS
    sources:
      - path: HomemTests
        excludes: [DesktopPictureInPictureTests.swift]
    dependencies:
      - target: HomemVision
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Homem.app/Homem"
  HomemVisionUITests:
    type: bundle.ui-testing
    platform: visionOS
    sources: [HomemVisionUITests, UITestSupport/Runner]
    dependencies:
      - target: HomemVision
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  HomemShare:
    type: app-extension
    platform: iOS
    sources:
      - path: HomemShare
      - path: Homem/Core/Credentials.swift
      - path: Homem/Core/OfficialSession.swift
      - path: Homem/Core/SharedAccountDirectory.swift
      - path: Homem/Core/ShareUploadClient.swift
      - path: Homem/Core/SharedFiles.swift
      - path: Homem/Core/JSONValue.swift
      - path: Homem/Core/Localization.swift
      - path: Homem/Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ad.neko.homem.share
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_FILE: HomemShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: HomemShare/HomemShare.entitlements
        'CODE_SIGN_ENTITLEMENTS[sdk=macosx*]': HomemShare/HomemShare-Mac.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: L10n-swift
  HomemTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HomemTests]
    dependencies:
      - target: Homem
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTS_MACCATALYST: NO
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Homem.app/Contents/MacOS/Homem"
  HomemUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HomemUITests, UITestSupport/Runner]
    dependencies:
      - target: Homem
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HomemMac:
    build:
      targets:
        HomemMac: all
    test:
      targets: [HomemMacTests]
  Homem:
    build:
      targets:
        Homem: all
    test:
      targets: [HomemTests, HomemUITests]
  HomemVision:
    build:
      targets:
        HomemVision: all
    test:
      targets: [HomemVisionTests, HomemVisionUITests]
